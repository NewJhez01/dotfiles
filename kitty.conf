# ==========================================
# Owen kitty.conf (bootstrap-managed)
# ==========================================

font_size 13.0

cursor_shape beam
cursor_blink_interval 0

scrollback_lines 10000

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted

# Match the transparent compositor-style look where the platform supports it.
background_opacity 0.88
dynamic_background_opacity yes

# cyberdream theme for kitty
background            #16181a
foreground            #ffffff
cursor                #ffffff
cursor_text_color     #16181a
selection_background  #3c4048
color0                #16181a
color8                #3c4048
color1                #ff6e5e
color9                #ff6e5e
color2                #5eff6c
color10               #5eff6c
color3                #f1ff5e
color11               #f1ff5e
color4                #5ea1ff
color12               #5ea1ff
color5                #bd5eff
color13               #bd5eff
color6                #5ef1ff
color14               #5ef1ff
color7                #ffffff
color15               #ffffff
selection_foreground  #ffffff
active_tab_foreground #000000
active_tab_background #ffbd5e
inactive_tab_foreground #ffffff
inactive_tab_background #16181a

font_family JetBrainsMono Nerd Font

window_padding_width 10

shell_integration enabled
shell /usr/bin/zsh

macos_option_as_alt yes
macos_thicken_font 0.15
